
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Ninja Pro - The Book</title>
    <link href="css/main.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <style>
        section {
            padding: 60px 0;
        }
    </style>
</head>
<body>

    <!-- navbar -->
    <nav class="navbar navbar-expand-md sticky-top navbar-light bg-light">
        <div class="container-xxl">
            <a href="index.html" class="navbar-brand">
                <span class="fw-bold text-primary">
                    <img class="img-fluid" src="public/logo.png" alt="Responsive Image" style="width: 80px; height: 80px">
                    AI Tatical Marketing
                </span>
            </a>
    
            <!-- toggle button for mobile nav -->
            <button class="navbar-toggler bg-primary" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
                aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <!-- navbar links  -->
            <div class="collapse navbar-collapse justify-content-end align-center" id="main-nav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-primary" href="about.html">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-primary" href="pricing.html">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-primary" href="contact.html">Get in Touch</a>
                    </li>
                    <li class="nav-item ms-2 d-none d-md-inline">
                        <a class="btn btn-outline-primary " href="sign-up.html">Sign-up!</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- contact form -->
    <section id="contact" class="bg-white">
        <div class="container-lg">
            <div class="text-center">
                <h2>Get in Touch</h2>
                <p class="lead">Questions to ask? Fill out the form to contact me directly...</p>
            </div>
    
            <div class="row justify-content-center my-5">
    
                <div class="col-lg-6 border-dark">
                    <form>
                        <label for="email" class="form-label">Email address:</label>
                        <div class="mb-4 input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope-fill"></i>
                            </span>
                            <input type="email" class="form-control" id="email" placeholder="e.g. mario@example.com">
                            <!-- tooltip -->
                            <span class="input-group-text">
                                <span class="tt" data-bs-placement="bottom" title="Enter an email address we can reply to.">
                                    <i class="bi bi-question-circle text-muted"></i>
                                </span>
                            </span>
                        </div>
    
                        <label for="name" class="form-label">Name:</label>
                        <div class="input-group mb-4">
                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" class="form-control" id="name" placeholder="e.g. Mario">
                            <!-- tooltip -->
                            <span class="input-group-text">
                                <span class="tt" data-bs-placement="bottom" title="Pretty explanatory really...">
                                    <i class="bi bi-question-circle text-muted"></i>
                                </span>
                            </span>
                        </div>
    
    
                        <label for="subject" class="form-label">What is your question about?</label>
                        <div class="input-group mb-4">
                            <span class="input-group-text">
                                <i class="bi bi-chat-right-dots-fill"></i>
                            </span>
                            <select id="subject" class="form-select">
                                <option value="pricing" selected>Pricing query</option>
                                <option value="content">Content query</option>
                                <option value="other">Other query</option>
                            </select>
                        </div>
    
    
    
                        <div class="form-floating mb-4 mt-5">
                            <textarea id="query" class="form-control" style="height: 140px"></textarea>
                            <label for="query">Your query...</label>
                        </div>
    
                        <div class="mb-4 text-center">
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
    
                    </form>
                </div>
            </div>
    </section>

    <div class="footer text-center">
        © <span class="text-dark" id="year"></span> AI Tactical Marketing. All rights reserved.
    </div>
</body>
</html>
